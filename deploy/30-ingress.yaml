# Ingress layout for yume.lab.thomasdev.xyz:
#   /    -> yume-client (static wasm, nginx)
#   /ws  -> yume-server:5002 (WebSocket — the aeronet WS server accepts the
#           /ws path as-is, so no strip middleware is needed)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: yume-web
  namespace: yume-vale
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  rules:
    - host: yume.lab.thomasdev.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: yume-client
                port:
                  number: 80
  tls:
    - hosts:
        - yume.lab.thomasdev.xyz
      secretName: yume-tls
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: yume-ws
  namespace: yume-vale
spec:
  ingressClassName: traefik
  rules:
    - host: yume.lab.thomasdev.xyz
      http:
        paths:
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: yume-server
                port:
                  number: 5002
  tls:
    - hosts:
        - yume.lab.thomasdev.xyz
      secretName: yume-tls
