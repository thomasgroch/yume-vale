# Ingress layout for yume.lab.thomasdev.xyz:
#   /           -> yume-client (static wasm, nginx)
#   /ws         -> yume-server:5002 (WebSocket game transport)
#   /admin      -> yume-admin:3001 (admin panel Next.js; /admin prefix stripped)
#   /api/admin  -> yume-server:5003 (admin REST + WS API; prefix NOT stripped)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: yume-web
  namespace: yume-vale
  # Note: no cert-manager annotation — the Certificate resource at
  # deploy/40-tls-certificate.yaml manages the yume-tls Secret explicitly.
spec:
  ingressClassName: traefik
  rules:
    - host: yume.lab.thomasdev.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: yume-client
                port:
                  number: 80
  tls:
    - hosts:
        - yume.lab.thomasdev.xyz
      secretName: yume-tls
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: yume-ws
  namespace: yume-vale
spec:
  ingressClassName: traefik
  rules:
    - host: yume.lab.thomasdev.xyz
      http:
        paths:
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: yume-server
                port:
                  number: 5002
  tls:
    - hosts:
        - yume.lab.thomasdev.xyz
      secretName: yume-tls
---
# Traefik Middleware: strip /admin prefix before forwarding to yume-admin.
# The Next.js app runs at root (/), so the prefix must be removed by Traefik.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-admin
  namespace: yume-vale
spec:
  stripPrefix:
    prefixes:
      - /admin
---
# Admin panel — served at /admin, prefix stripped before reaching Next.js.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: yume-admin
  namespace: yume-vale
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: yume-vale-strip-admin@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: yume.lab.thomasdev.xyz
      http:
        paths:
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: yume-admin
                port:
                  number: 3001
  tls:
    - hosts:
        - yume.lab.thomasdev.xyz
      secretName: yume-tls
---
# Admin API — /api/admin proxied directly to game server port 5003.
# No prefix stripping: the axum router handles the full /api/admin/v1/... path.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: yume-admin-api
  namespace: yume-vale
spec:
  ingressClassName: traefik
  rules:
    - host: yume.lab.thomasdev.xyz
      http:
        paths:
          - path: /api/admin
            pathType: Prefix
            backend:
              service:
                name: yume-server
                port:
                  number: 5003
  tls:
    - hosts:
        - yume.lab.thomasdev.xyz
      secretName: yume-tls
