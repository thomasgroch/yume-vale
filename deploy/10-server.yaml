# Yume Vale authoritative game server (Bevy + Lightyear).
# One process, 5 listeners: UDP:5000 (native), WT:5001 (WebTransport browser),
# WS:5002 (browser fallback), HTTP:5003 (admin API — requires YUME_ADMIN_TOKEN).
#
# Argo CD sync wave: 2 (after postgres + TLS at wave 1)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yume-server
  namespace: yume-vale
  labels:
    app: yume-server
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  strategy:
    type: Recreate # single authoritative world; no rolling state handoff
  selector:
    matchLabels:
      app: yume-server
  template:
    metadata:
      labels:
        app: yume-server
    spec:
      containers:
        - name: server
          image: ghcr.io/thomasgroch/yume-vale-server:sha-d8b5329fd0c8371e1ba42f477cbbda9fe278d603
          imagePullPolicy: Always
          ports:
            - name: netcode-udp
              containerPort: 5000
              protocol: UDP
            - name: webtransport
              containerPort: 5001
              protocol: UDP
            - name: websocket
              containerPort: 5002
              protocol: TCP
            - name: admin-api
              containerPort: 5003
              protocol: TCP
          env:
            # TLS certificate paths — the yume-tls Secret is mounted below
            - name: YUME_TLS_CERT
              value: /etc/yume-tls/tls.crt
            - name: YUME_TLS_KEY
              value: /etc/yume-tls/tls.key
            # PostgreSQL connection string (from SealedSecret)
            - name: YUME_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: yume-db
                  key: url
            # Admin API token — set this secret to enable the admin panel.
            # If unset, port 5003 is not bound and the admin API is disabled.
            - name: YUME_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: yume-admin
                  key: token
                  optional: true
          volumeMounts:
            - name: tls
              mountPath: /etc/yume-tls
              readOnly: true
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            tcpSocket:
              port: websocket
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: websocket
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: tls
          secret:
            secretName: yume-tls
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
---
# ClusterIP: WebSocket (5002) and admin API (5003) reached by Traefik via Ingress.
apiVersion: v1
kind: Service
metadata:
  name: yume-server
  namespace: yume-vale
  labels:
    app: yume-server
spec:
  type: ClusterIP
  selector:
    app: yume-server
  ports:
    - name: websocket
      port: 5002
      targetPort: websocket
      protocol: TCP
    - name: admin-api
      port: 5003
      targetPort: admin-api
      protocol: TCP
---
# LoadBalancer (k3s ServiceLB): native clients connect straight to UDP 5000
# on the node's public IP; browser WebTransport clients use UDP 5001.
apiVersion: v1
kind: Service
metadata:
  name: yume-server-udp
  namespace: yume-vale
  labels:
    app: yume-server
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  type: LoadBalancer
  selector:
    app: yume-server
  ports:
    - name: netcode-udp
      port: 5000
      targetPort: netcode-udp
      protocol: UDP
    - name: webtransport
      port: 5001
      targetPort: webtransport
      protocol: UDP
