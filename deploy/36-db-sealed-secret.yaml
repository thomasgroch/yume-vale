# Sealed Secret for the PostgreSQL database credentials.
#
# ⚠  DO NOT EDIT THIS FILE DIRECTLY — it contains encrypted ciphertext.
#
# ## How to regenerate
#
# 1. Generate a random password (32 alphanumeric chars):
#      openssl rand -base64 24 | tr -dc 'a-zA-Z0-9' | head -c32 | pbcopy
#
# 2. Create a temporary Secret YAML in the right namespace:
#      cat <<EOF > /tmp/yume-db-secret.yaml
#      apiVersion: v1
#      kind: Secret
#      metadata:
#        name: yume-db
#        namespace: yume-vale
#      stringData:
#        password: <paste-password-here>
#      EOF
#
# 3. Seal it with the cluster controller (runs in kube-system on this cluster):
#      kubeseal --controller-namespace=kube-system \
#               --controller-name=sealed-secrets-controller \
#               --format=yaml \
#               < /tmp/yume-db-secret.yaml \
#               > deploy/36-db-sealed-secret.yaml
#
# 4. Remove the plaintext:
#      rm /tmp/yume-db-secret.yaml
#      pbcopy < /dev/null   # clear clipboard (macOS)
#
# 5. Commit the new ciphertext:
#      git add deploy/36-db-sealed-secret.yaml
#      git commit -m "deploy: rotate DB password [skip ci]"
#
# 6. Deploy (Argo CD syncs automatically, or kubectl apply):
#      kubectl apply -f deploy/36-db-sealed-secret.yaml
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: yume-db
  namespace: yume-vale
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  encryptedData:
    password: 
  template:
    metadata:
      name: yume-db
      namespace: yume-vale
      annotations:
        argocd.argoproj.io/sync-wave: "1"
    type: Opaque
