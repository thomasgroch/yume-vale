# Yume Vale admin panel — Next.js app served by Node.js (standalone build).
# Argo CD sync wave 3: after server (wave 2).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yume-admin
  namespace: yume-vale
  labels:
    app: yume-admin
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: yume-admin
  template:
    metadata:
      labels:
        app: yume-admin
    spec:
      containers:
        - name: admin
          image: ghcr.io/thomasgroch/yume-vale-admin:sha-0e6396878cf8b7cfd0bba6cf122ec731a7aa1d93
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP
          env:
            - name: PORT
              value: "3001"
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: NODE_ENV
              value: production
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # basePath="/admin" (apps/admin/next.config.js) means the app only
          # answers under /admin — the bare "/" 404s, which would otherwise
          # fail these probes and crashloop a perfectly healthy container.
          readinessProbe:
            httpGet:
              path: /admin
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /admin
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: yume-admin
  namespace: yume-vale
  labels:
    app: yume-admin
spec:
  type: ClusterIP
  selector:
    app: yume-admin
  ports:
    - name: http
      port: 3001
      targetPort: http
      protocol: TCP
