[package]
name = "tools"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "tools"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
rcgen = "0.13"
sha2 = "0.10"
hex = "0.4"
time = { version = "0.3", features = ["formatting"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
argon2 = "0.5"
rpassword = "7"
# argon2's password-hash dep needs rand_core/getrandom for SaltString::generate;
# nothing else in this binary's own dependency tree happens to pull that
# feature in (unlike game_server, where it rides in transitively via
# bevy/wgpu — don't rely on that elsewhere either, it's incidental).
rand_core = { version = "0.6", features = ["getrandom"] }
