server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Stock mime.types already maps .wasm -> application/wasm; a custom types
    # block here would REPLACE the inherited map and break .html/.js.
    include /etc/nginx/mime.types;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        application/wasm
        application/javascript
        text/css
        text/html
        model/gltf-binary
        application/octet-stream;

    # index.html must always be fresh; hashed trunk artifacts and GLBs can cache.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=604800";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
