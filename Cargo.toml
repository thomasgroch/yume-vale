[workspace]
resolver = "2"
members = [
    "crates/game_core",
    "crates/game_protocol",
    "crates/game_client",
    "crates/game_server",
    "crates/features/player",
    "apps/client",
    "apps/server",
    "apps/tools",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.86"

[workspace.dependencies]
bevy = { version = "0.19.0", default-features = false }
lightyear = { version = "0.28.0", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
thiserror = "2.0.18"
glam = { version = "0.32", features = ["serde"] }
aeronet_websocket = "0.21.0"
aeronet_webtransport = "0.21.0"
rustls-pemfile = "2.2"
bevy_replicon = "0.41"
avian3d = { version = "0.7", default-features = false }
bevy-tnua = "0.32"
bevy-tnua-avian3d = "0.12"
serde_json = "1"

game_core = { path = "crates/game_core" }
game_protocol = { path = "crates/game_protocol" }
game_client = { path = "crates/game_client" }
game_server = { path = "crates/game_server" }
player = { path = "crates/features/player" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
strip = true
lto = "thin"
