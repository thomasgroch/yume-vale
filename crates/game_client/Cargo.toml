[package]
name = "game_client"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
inspector = ["dep:bevy-inspector-egui"]

[dependencies]
bevy = { workspace = true, features = ["3d", "ui", "default_font", "webp"] }
bevy-inspector-egui = { version = "0.37", optional = true }
game_core = { workspace = true }
game_protocol = { workspace = true }
player = { workspace = true }
serde_json = { workspace = true }
dirs = "6"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
lightyear = { workspace = true, features = ["client", "udp", "netcode", "std", "replication", "interpolation"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
lightyear = { workspace = true, features = ["client", "netcode", "replication", "interpolation", "std", "webtransport", "websocket"] }
web-sys = { version = "0.3", features = ["Document", "EventTarget", "Location", "Storage", "Window"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
getrandom = { version = "0.3", features = ["wasm_js"] }
aeronet_websocket.workspace = true

[dev-dependencies]
serde_json.workspace = true
serde = { workspace = true }
