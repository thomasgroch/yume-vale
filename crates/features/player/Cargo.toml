[package]
name = "player"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
physics = ["dep:avian3d"]

[dependencies]
bevy = { workspace = true, features = ["3d"] }
lightyear = { workspace = true, features = ["replication", "prediction", "input_native"] }
serde = { workspace = true }
game_core = { workspace = true }
game_protocol = { workspace = true }
avian3d = { workspace = true, features = ["3d", "parry-f32"], optional = true }

[dev-dependencies]
serde_json.workspace = true
