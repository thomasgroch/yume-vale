name: images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # ---------------------------------------------------------------------------
  # Detect which independent stack changed, so a push touching only
  # apps/admin (Next.js, no shared code with the game) doesn't rebuild and
  # redeploy the Rust server+client — that wastes ~25min AND restarts the
  # server pod, wiping every live game connection and every admin session
  # (sessions are in-memory) for no reason. Server+client stay coupled
  # together (see AGENTS.md: "Rebuild server+client TOGETHER after protocol
  # changes") — only admin is independent enough to split out.
  # ---------------------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      admin: ${{ steps.filter.outputs.admin }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'apps/server/**'
              - 'apps/client/**'
              - 'apps/tools/**'
              - 'apps/xtask/**'
              - 'assets/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'Dockerfile.server'
              - 'Dockerfile.client'
            admin:
              - 'apps/admin/**'
              - 'Dockerfile.admin'

  # ---------------------------------------------------------------------------
  # Check: format, lint, unit tests + persistence contract tests (SQLite).
  # ---------------------------------------------------------------------------
  check:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install system deps
        run: sudo apt-get update -q && sudo apt-get install -y libudev-dev

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      # Cache cargo registry (lock-file-keyed; sccache handles artifacts)
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"

      - name: Check formatting
        run: cargo fmt --all -- --check

      # Clippy only on library/binary targets (tests compiled in the next step)
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Run tests (SQLite default)
        run: cargo test --workspace

  # ---------------------------------------------------------------------------
  # Wasm client build — compiles the actual `client` binary (apps/client),
  # the same target Dockerfile.client publishes. Building `game_client` alone
  # skips apps/client's getrandom wasm_js feature aliases and can pass locally
  # while failing for real users.
  # ---------------------------------------------------------------------------
  wasm:
    needs: [changes, check]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Install wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"

      # certs/ is gitignored (dev-only); the WT digest include_str! in
      # game_client needs a placeholder — same as Dockerfile.client does.
      - name: Create dev cert placeholder
        run: mkdir -p certs && echo 00 > certs/digest.txt

      - name: Build wasm client
        run: cargo build --package client --target wasm32-unknown-unknown

  # ---------------------------------------------------------------------------
  # Container images — only the stack(s) that actually changed (see `changes`
  # above). matrix.group ties each image to the filter that should gate it.
  # ---------------------------------------------------------------------------
  build:
    needs: [changes, check]
    # matrix.* isn't available in a job-level if — the check.result gate
    # lives here (it doesn't depend on matrix); which matrix legs actually
    # do anything is decided per-step below via the `gate` step's output.
    if: always() && (needs.check.result == 'success' || needs.check.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            dockerfile: Dockerfile.server
            group: rust
          - name: client
            dockerfile: Dockerfile.client
            group: rust
          - name: admin
            dockerfile: Dockerfile.admin
            group: admin
    steps:
      - name: Gate on changed stack
        id: gate
        run: |
          if [ "${{ matrix.group }}" = "rust" ] && [ "${{ needs.changes.outputs.rust }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ matrix.group }}" = "admin" ] && [ "${{ needs.changes.outputs.admin }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: docker/setup-buildx-action@v3
        if: steps.gate.outputs.run == 'true'

      - uses: docker/login-action@v3
        if: steps.gate.outputs.run == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        if: steps.gate.outputs.run == 'true'
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/yume-vale-${{ matrix.name }}:latest
            ghcr.io/${{ github.repository_owner }}/yume-vale-${{ matrix.name }}:sha-${{ github.sha }}

  # Pin the freshly built image sha into the k8s manifests so Argo CD sees a
  # diff and rolls the pods (plain `:latest` never changes the manifests).
  # Only pins the manifest(s) for the stack(s) actually rebuilt this run —
  # an unchanged stack keeps its existing pin untouched.
  # [skip ci] on the commit avoids re-triggering this workflow.
  rollout:
    needs: [changes, build]
    if: |
      always() &&
      needs.build.result != 'failure' &&
      (needs.changes.outputs.rust == 'true' || needs.changes.outputs.admin == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Pin image sha in manifests
        run: |
          if [ "${{ needs.changes.outputs.rust }}" = "true" ]; then
            sed -i -E "s|(yume-vale-server:)[a-zA-Z0-9._-]+|\1sha-${{ github.sha }}|" deploy/10-server.yaml
            sed -i -E "s|(yume-vale-client:)[a-zA-Z0-9._-]+|\1sha-${{ github.sha }}|" deploy/20-client.yaml
          fi
          if [ "${{ needs.changes.outputs.admin }}" = "true" ]; then
            sed -i -E "s|(yume-vale-admin:)[a-zA-Z0-9._-]+|\1sha-${{ github.sha }}|" deploy/50-admin.yaml
          fi
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy/10-server.yaml deploy/20-client.yaml deploy/50-admin.yaml
          git commit -m "deploy: pin images to sha-${{ github.sha }} [skip ci]" || exit 0
          git push

  # Discord notification — always runs, reports success or failure of the pipeline.
  # Builds the JSON payload with jq (not string interpolation) so a commit
  # message with quotes/newlines can't produce malformed JSON.
  notify:
    needs: [check, wasm, build, rollout]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          STATUS="${{ contains(needs.*.result, 'failure') && '❌ falhou' || '✅ sucesso' }}"
          jq -n --arg s "Yume Vale deploy: $STATUS — sha-${GITHUB_SHA:0:7}" '{content: $s}' \
            | curl -sf -X POST -H "Content-Type: application/json" -d @- "${{ secrets.DISCORD_WEBHOOK_URL }}"
