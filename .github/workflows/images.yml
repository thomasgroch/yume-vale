name: images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # ---------------------------------------------------------------------------
  # Check: format, lint, unit tests + persistence contract tests against SQLite
  # and PostgreSQL (when service is available).
  # ---------------------------------------------------------------------------
  check:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: yumevale_test
          POSTGRES_USER: yumevale
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install system deps
        run: sudo apt-get update -q && sudo apt-get install -y libudev-dev

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      # Cache cargo registry (lock-file-keyed; sccache handles artifacts)
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"

      - name: Check formatting
        run: cargo fmt --all -- --check

      # Clippy only on library/binary targets (tests compiled in the next step)
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Run tests (SQLite default)
        run: cargo test --workspace

      - name: Run persistence contract tests against PostgreSQL
        run: cargo test -p game_persistence -- --test-threads=1
        env:
          YUME_TEST_DATABASE_URL: postgres://yumevale:ci-test-password@localhost:5432/yumevale_test

  # ---------------------------------------------------------------------------
  # Wasm client build (separate job — uses pinned toolchain)
  # ---------------------------------------------------------------------------
  wasm:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Cache wasm build
        uses: Swatinem/rust-cache@v2

      - name: Build wasm client
        run: cargo build --package game_client --target wasm32-unknown-unknown

  # ---------------------------------------------------------------------------
  # Container images (server + client)
  # ---------------------------------------------------------------------------
  build:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            dockerfile: Dockerfile.server
          - name: client
            dockerfile: Dockerfile.client
          - name: admin
            dockerfile: Dockerfile.admin
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/yume-vale-${{ matrix.name }}:latest
            ghcr.io/${{ github.repository_owner }}/yume-vale-${{ matrix.name }}:sha-${{ github.sha }}

  # Pin the freshly built image sha into the k8s manifests so Argo CD sees a
  # diff and rolls the pods (plain `:latest` never changes the manifests).
  # [skip ci] on the commit avoids re-triggering this workflow.
  rollout:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Pin image sha in manifests
        run: |
          sed -i -E "s|(yume-vale-server:)[a-zA-Z0-9._-]+|\1sha-${{ github.sha }}|" deploy/10-server.yaml
          sed -i -E "s|(yume-vale-client:)[a-zA-Z0-9._-]+|\1sha-${{ github.sha }}|" deploy/20-client.yaml
          sed -i -E "s|(yume-vale-admin:)[a-zA-Z0-9._-]+|\1sha-${{ github.sha }}|"  deploy/50-admin.yaml
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy/10-server.yaml deploy/20-client.yaml deploy/50-admin.yaml
          git commit -m "deploy: pin images to sha-${{ github.sha }} [skip ci]" || exit 0
          git push
